# ============================================================
# MARC 2026 Platform Configuration
# ============================================================
# 플랫폼 공통 설정 파일. 시나리오 간 공유되는 정보를 정의한다.
#
# - 플랫폼 식별 정보 (ROS2 네임스페이스, 토큰 해시 시드)
# - CCTV 카메라 기본값 (시나리오에서 미지정 시 적용)
# - 미션 오브젝트 에셋 정의 (USD 파일, 스케일, 재활용 분류)
# - 랜드마크 에셋 정의
# ============================================================
version: "2026.2"

# ------------------------------------------------------------
# 플랫폼 식별
# ------------------------------------------------------------
platform:
  namespace: marc
  # 토큰 해시 시드. token = MD5(team_id + hash_seed) 이므로 노출 시 임의 팀 토큰 위조 가능.
  # ⚠️ 공개 저장소/배포 이미지에는 실제 시드를 두지 않는다. 아래는 연습/개발용 placeholder이며,
  #    대회 서버는 환경변수 MARC_HASH_SEED 로 실제 시드를 주입한다(이 값보다 우선 적용).
  hash_seed: "marc2026-dev-local-seed"

# ------------------------------------------------------------
# 로봇 (시나리오 무관 단일 모델)
#   usd_file 경로는 {resources}/ 기준 상대 경로 (예: assets/robot/...)
# ------------------------------------------------------------
robot:
  usd_file: assets/robot/metacombot2_USD/metacombot2.usd
  # 런타임에서 로봇을 robot station(바닥 데칼) 위로 띄울 높이(m).
  # 에디터는 station 위치/방향만 저작하고, 로봇은 런타임에서 station + spawn_height 에 배치된다.
  # metacombot2.usd 는 prim 원점 기준 바닥(z_min)이 -0.3315m 라, station z 에 원점을 놓으면
  # 차체가 0.33m 묻힌다. 바닥을 지면에 올리도록 0.34(=0.3315 + 1cm 침투여유)만큼 띄운다.
  spawn_height: 0.5

# ------------------------------------------------------------
# CCTV 카메라 기본값 (HIKVISION DS-2CD2683G2-LIZS2U)
#   센서: 1/2.8" Progressive Scan CMOS, 8MP
#   렌즈: 가변초점 2.8~12mm, F1.6
#   시나리오 camera 섹션에서 미지정된 값에 적용
# ------------------------------------------------------------
camera_defaults:
  focal_length: 4.0             # mm (가변초점 2.8~12mm 중 기본값)
  horizontal_aperture: 5.6      # mm (1/2.8" 센서)
  ground_height: 1.0            # m
  resolution: [3840, 2160]      # px (8MP, 16:9)

# ------------------------------------------------------------
# 미션 오브젝트 에셋 정의
#   - 이 섹션의 키 목록 = 지원하는 오브젝트 유형 목록
