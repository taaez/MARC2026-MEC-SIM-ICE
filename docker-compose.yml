# 리포지토리 루트에 둔다. 주최측은 clone 직후 `docker compose up` 만 실행한다.
# 구조·환경변수 이름은 스타터킷 demo/docker-compose.yml 과 동일하게 맞춘다
# (MARC_TEAM_ID / MARC_TOKEN / ROS_DOMAIN_ID / RMW_IMPLEMENTATION, network_mode: host,
#  GPU 는 deploy.resources 블록).
services:
  agent:
    build:
      context: .                  # 스타터킷 루트 (marc_sdk + stage1 + demo + models 포함)
      dockerfile: docker/Dockerfile
      args:
        # 3B (2026-08-28, VRAM 12GB 예산 -- docker/Dockerfile 의 ARG 설명 참고).
        # 여기가 실제 빌드에 쓰이는 값이다(주최측은 이 파일 그대로 `docker
        # compose up` 만 실행 -- Dockerfile 의 ARG 기본값은 여기서 덮어써짐).
        VLM_MODEL: "Qwen/Qwen2.5-VL-3B-Instruct"
        DET_MODEL: "IDEA-Research/grounding-dino-base"
    image: marc-mec-sim-ice-stage1:qualifier
    network_mode: host            # DDS discovery over the LAN
    environment:
      # 제출용: ':-' 뒤 기본값이 곧 제출값 (주최측은 env 없이 실행)
      MARC_TEAM_ID:  "${MARC_TEAM_ID:-mec_sim_ice}"
      MARC_TOKEN:    "${MARC_TOKEN:-PASTE_TEAM_TOKEN_HERE}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      # 기본이 이미 3B(위 build.args)라 로컬 8GB 개발도 추가 설정 없이 그대로 됨.
      # 7B로 품질을 올리고 싶으면: 위 build.args VLM_MODEL 을 7B로 바꾸고
      # MARC_VLM_4BIT=1 도 같이 켤 것(CUDA 전용 -- 채점 서버/랩 데스크탑만 해당).
      MARC_VLM_4BIT: "${MARC_VLM_4BIT:-0}"
      MARC_YOLO_WEIGHTS: "${MARC_YOLO_WEIGHTS:-/agent/models/yolo_marc.pt}"
      MARC_LOG_LEVEL: "INFO"
    # GPU (nvidia-container-toolkit 필요) — 원본 demo compose 와 동일한 지정 방식
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
