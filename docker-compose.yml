# 리포지토리 루트에 둔다. 주최측은 clone 직후 `docker compose up` 만 실행한다.
# 구조·환경변수 이름은 스타터킷 demo/docker-compose.yml 과 동일하게 맞춘다
# (MARC_TEAM_ID / MARC_TOKEN / ROS_DOMAIN_ID / RMW_IMPLEMENTATION, network_mode: host,
#  GPU 는 deploy.resources 블록).
services:
  agent:
    build:
      context: .                  # 스타터킷 루트 (marc_sdk + stage1 + demo + models 포함)
      dockerfile: docker/Dockerfile
      args:
        # 텍스트 전용 소형 LM(1.5B, 2026-08-29 -- VL 모델 지원 자체를 뺐다,
        # taejeong/vlm_fallback.py 참고). 여기가 실제 빌드에 쓰이는 값이다
        # (주최측은 이 파일 그대로 `docker compose up` 만 실행 -- Dockerfile
        # 의 ARG 기본값은 여기서 덮어써짐).
        VLM_MODEL: "Qwen/Qwen2.5-1.5B-Instruct"
        DET_MODEL: "IDEA-Research/grounding-dino-base"
    image: marc-mec-sim-ice-stage1:qualifier
    network_mode: host            # DDS discovery over the LAN
    environment:
      # 제출용: ':-' 뒤 기본값이 곧 제출값 (주최측은 env 없이 실행)
      MARC_TEAM_ID:  "${MARC_TEAM_ID:-mec_sim_ice}"
      MARC_TOKEN:    "${MARC_TOKEN:-PASTE_YOUR_TOKEN_HERE}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      # YOLO 가중치 override -- taejeong_agent_vla.py 가 읽는 변수는
      # TAEJEONG_DET_WEIGHTS 다(MARC_YOLO_WEIGHTS 가 아니다 -- 그건 다른
      # 진입점(stage1/pipeline.py, 지금 CMD 로는 안 쓰임)의 변수라 여기 있으면
      # 오해만 산다. 기본은 이미지 안 경로(/agent/demo/weights/best.pt, Dockerfile
      # 의 COPY mec_sim_ice/demo_agents 로 자동 baking됨)라 지정 안 해도 된다.
      TAEJEONG_DET_WEIGHTS: "${TAEJEONG_DET_WEIGHTS:-/agent/demo/weights/best.pt}"
      MARC_LOG_LEVEL: "INFO"
    # GPU (nvidia-container-toolkit 필요) — 원본 demo compose 와 동일한 지정 방식
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
