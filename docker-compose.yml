# 리포지토리 루트에 둔다. 주최측은 clone 직후 `docker compose up` 만 실행한다.
# 구조·환경변수 이름은 스타터킷 demo/docker-compose.yml 과 동일하게 맞춘다
# (MARC_TEAM_ID / MARC_TOKEN / ROS_DOMAIN_ID / RMW_IMPLEMENTATION, network_mode: host,
#  GPU 는 deploy.resources 블록).
services:
  agent:
    build:
      context: .                  # 스타터킷 루트 (marc_sdk + demo + mec_sim_ice + manipulation 포함)
      dockerfile: docker/Dockerfile
      args:
        # 텍스트 전용 소형 LM(1.5B, 2026-08-29 -- VL 모델 지원 자체를 뺐다,
        # vla_grounding/vlm_fallback.py 참고). 여기가 실제 빌드에 쓰이는 값이다
        # (주최측은 이 파일 그대로 `docker compose up` 만 실행 -- Dockerfile
        # 의 ARG 기본값은 여기서 덮어써짐).
        VLM_MODEL: "Qwen/Qwen2.5-1.5B-Instruct"
        DET_MODEL: "IDEA-Research/grounding-dino-base"
    image: marc-mec-sim-ice-stage1:qualifier
    network_mode: host            # DDS discovery over the LAN
    environment:
      # 제출용: ':-' 뒤 기본값이 곧 제출값 (주최측은 env 없이 실행)
      MARC_TEAM_ID:  "${MARC_TEAM_ID:-mec_sim_ice}"
      MARC_TOKEN:    "${MARC_TOKEN:-2a5b6258f40b17057ba4a863529c0e2d}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      # YOLO 가중치 override -- vla_grounding_agent.py 가 읽는 변수는
      # VLA_DET_WEIGHTS 다. 기본값을 여기 지정하지 않는다: 그 코드
      # 자체의 기본값이 이미 dirname(__file__)/weights/best.pt 로 자기 위치
      # 기준 상대경로라 컨테이너 안에서도 올바르게 풀린다 -- 여기서 절대경로를
      # 박아두면 mec_sim_ice/ 의 COPY 위치가 바뀔 때마다 다시 어긋나는 종류의
      # 버그가 재발한다 (실제로 이전에 그랬다).
      # Grounding DINO 폴백 OFF (기본은 ON). "1"이면 dino_fallback.is_disabled()가
      # True -> 라이브 에이전트/오프라인 채점 둘 다 DINO 재탐색을 건너뛴다.
      # 되돌리려면 이 줄을 지우거나 "0" 으로.
      MARC_DISABLE_DINO_FALLBACK: "${MARC_DISABLE_DINO_FALLBACK:-1}"
      MARC_LOG_LEVEL: "INFO"
      # Stage 2 지역 주행: 최종 코드는 지역 내비게이션 함수 + MPPI(+ 점유 격자). 코드 기본값도
      # mppi 지만 제출 설정을 여기서 명시한다 ("legacy" = A* + P 제어, ablation 비교용).
      MARC_LOCAL_PLANNER: "${MARC_LOCAL_PLANNER:-mppi}"
    # GPU (nvidia-container-toolkit 필요) — 원본 demo compose 와 동일한 지정 방식
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
